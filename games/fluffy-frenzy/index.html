<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fluffy Frenzy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&display=swap" rel="stylesheet">
<style>
  :root { --ink:#3b2416; --cream:#fff6e6; --gold:#ffd23f; --red:#e8453c; --panel:rgba(255,246,230,.94); }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; overflow:hidden; background:#2a1010; font-family:"Baloo 2","Segoe UI",Arial,sans-serif; color:var(--ink); user-select:none; }
  canvas#c { position:fixed; inset:0; width:100vw; height:100vh; display:block; }
  [hidden] { display:none !important; }
  button { font-family:inherit; cursor:pointer; }

  #title { position:fixed; top:1.2vh; left:0; right:0; text-align:center; pointer-events:none; }
  #title h1 { margin:0; font-size:clamp(34px,5vw,62px); font-weight:800; color:#ffe27a; letter-spacing:2px;
              text-shadow:0 0 18px #ff9b3d, 0 0 40px #ff6a00, 0 4px 0 #8a2b10; line-height:1; }
  #title div { color:#ffe9c7; font-size:clamp(16px,2vw,22px); text-shadow:0 2px 4px #0008; }
  #menu { position:fixed; left:50%; bottom:2.5vh; transform:translateX(-50%); width:min(720px,94vw);
          background:var(--panel); border-radius:22px; padding:12px 20px 14px; box-shadow:0 10px 30px #0007; border:4px solid #fff; }
  .row { display:flex; align-items:center; justify-content:center; gap:12px; margin:5px 0; flex-wrap:wrap; }
  .row label { font-weight:800; min-width:80px; text-align:right; }
  .pick button { width:50px; height:50px; border-radius:50%; border:none; background:var(--gold); font-size:22px; color:var(--ink); box-shadow:0 4px 0 #c99a10; }
  .pick button:active { transform:translateY(3px); box-shadow:0 1px 0 #c99a10; }
  #animalName { min-width:240px; text-align:center; font-size:30px; font-weight:800; line-height:1.05; }
  #animalName small { display:block; font-size:15px; font-weight:600; opacity:.75; }
  .seg { display:flex; background:#ead9bd; border-radius:999px; padding:3px; flex-wrap:wrap; justify-content:center; }
  .seg button { border:none; background:transparent; padding:5px 13px; border-radius:999px; font-size:16px; font-weight:700; color:var(--ink); }
  .seg button.on { background:var(--red); color:#fff; }
  #modeDesc { font-size:14px; text-align:center; min-height:20px; opacity:.85; }
  #play { display:block; margin:8px auto 4px; border:none; background:var(--red); color:#fff; font-size:30px; font-weight:800;
          padding:4px 64px; border-radius:999px; box-shadow:0 6px 0 #9c2a22; letter-spacing:2px; }
  #play:active { transform:translateY(4px); box-shadow:0 2px 0 #9c2a22; }
  .keys { font-size:13px; text-align:center; opacity:.85; line-height:1.55; }
  .keys b { background:#ead9bd; border-radius:5px; padding:0 5px; }

  #hud { position:fixed; inset:0; pointer-events:none; }
  #topbar { position:absolute; top:10px; left:50%; transform:translateX(-50%); text-align:center; background:var(--panel);
            border-radius:16px; padding:4px 22px 6px; border:3px solid #fff; box-shadow:0 4px 12px #0004; min-width:260px; }
  #modeName { font-weight:800; font-size:16px; color:var(--red); }
  #timer { font-size:34px; font-weight:800; line-height:1; }
  #objective { font-size:13px; opacity:.85; }
  #objective .ts { font-size:22px; font-weight:800; }
  #board { position:absolute; top:10px; right:10px; background:var(--panel); border-radius:14px; padding:6px 10px; width:240px; border:3px solid #fff; box-shadow:0 4px 12px #0004; }
  #board .r { display:flex; align-items:center; gap:6px; font-size:15px; font-weight:700; padding:1px 0; }
  #board .r.out { opacity:.4; text-decoration:line-through; }
  #board .r.me { color:#b8460e; }
  #board .dot { width:12px; height:12px; border-radius:50%; border:2px solid #0004; flex:none; }
  #board .nm { flex:1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  #board .hp { width:46px; height:7px; background:#0002; border-radius:4px; overflow:hidden; }
  #board .hp i { display:block; height:100%; background:#5cc45c; }
  #me { position:absolute; left:12px; bottom:12px; background:var(--panel); border-radius:16px; padding:8px 14px; width:310px; border:3px solid #fff; box-shadow:0 4px 12px #0004; }
  #me .nm { font-size:20px; font-weight:800; line-height:1.1; }
  #meTalent { font-size:13px; font-weight:700; color:#8a4a10; }
  .bar { height:15px; background:#0002; border-radius:8px; overflow:hidden; margin:3px 0; }
  .bar i { display:block; height:100%; border-radius:8px; }
  #meHp i { background:linear-gradient(#7ddc5c,#46a83a); }
  #meSta { height:8px; } #meSta i { background:#ffc53d; }
  #meBlk { height:6px; } #meBlk i { background:#6fb7ff; }
  #meStatus { display:flex; gap:6px; flex-wrap:wrap; font-size:13px; font-weight:700; min-height:22px; }
  #meStatus span { background:#ead9bd; border-radius:8px; padding:1px 8px; }
  #feed { position:absolute; left:12px; top:12px; display:flex; flex-direction:column; gap:4px; }
  #feed div { background:#000a; color:#fff; padding:2px 10px; border-radius:8px; font-size:15px; font-weight:600; }
  #big { position:absolute; top:30%; left:0; right:0; text-align:center; font-size:clamp(44px,8vw,110px); font-weight:800; color:#ffe27a;
         text-shadow:0 0 20px #ff7a00, 0 5px 0 #8a2b10; line-height:1.05; }
  #sub { position:absolute; top:50%; left:0; right:0; text-align:center; font-size:24px; font-weight:800; color:#fff; text-shadow:0 2px 4px #000; padding:0 20px; }
  #prompt { position:absolute; left:50%; bottom:22%; transform:translateX(-50%); background:#000b; color:#fff; padding:4px 14px; border-radius:10px; font-weight:700; }
  #tags { position:fixed; inset:0; pointer-events:none; overflow:hidden; }
  .tag { position:absolute; transform:translate(-50%,-100%); text-align:center; font-size:13px; font-weight:800; color:#fff; text-shadow:0 1px 3px #000; white-space:nowrap; }
  .tag .hp { width:54px; height:6px; margin:1px auto 0; background:#0007; border-radius:3px; overflow:hidden; }
  .tag .hp i { display:block; height:100%; background:#7ddc5c; }
  .tag.me { color:#ffe27a; }
  .flagTag { position:absolute; transform:translate(-50%,-50%); width:34px; height:34px; border-radius:50%; border:3px solid #fff; color:#fff;
             font-weight:800; font-size:18px; display:flex; align-items:center; justify-content:center; box-shadow:0 2px 6px #0006; }
  .dmg { position:absolute; transform:translate(-50%,-50%); font-weight:800; font-size:26px; color:#ffe066; text-shadow:0 2px 0 #8a2b10, 0 0 6px #000; }

  .panel { position:fixed; left:50%; top:50%; transform:translate(-50%,-50%); background:var(--panel); border-radius:22px; padding:18px 26px;
           border:4px solid #fff; box-shadow:0 10px 30px #0008; text-align:center; width:min(560px,92vw); max-height:92vh; overflow:auto; }
  .panel h2 { margin:0 0 6px; font-size:36px; font-weight:800; color:var(--red); line-height:1.1; }
  .panel table { width:100%; border-collapse:collapse; margin:8px 0 12px; font-size:17px; }
  .panel td { padding:3px 6px; border-bottom:1px solid #0001; text-align:left; }
  .panel td:last-child { text-align:right; font-weight:800; }
  .panel tr.me td { color:#b8460e; font-weight:800; }
  .btn { border:none; background:var(--red); color:#fff; font-size:20px; font-weight:800; padding:6px 22px; border-radius:999px; margin:4px; box-shadow:0 4px 0 #9c2a22; }
  #muteBtn { position:fixed; right:12px; bottom:12px; z-index:20; width:46px; height:46px; border-radius:50%; border:3px solid #fff;
             background:var(--panel); font-size:22px; box-shadow:0 4px 12px #0004; padding:0; }
  .btn.alt { background:#8a7a62; box-shadow:0 4px 0 #5e5240; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="tags"></div>
<button id="muteBtn" title="Tắt/bật âm thanh (M)">🔊</button>

<div id="title"><h1>FLUFFY FRENZY</h1><div>Đại chiến thú cưng 3D</div></div>

<div id="menu">
  <div class="row pick"><button id="prev" aria-label="Trước">◀</button><div id="animalName"></div><button id="next" aria-label="Sau">▶</button></div>
  <div class="row"><label>Chế độ</label>
    <div class="seg" id="modeSeg"><button data-v="random" class="on">Ngẫu nhiên</button><button data-v="arena">Đấu trường</button><button data-v="team">Chiếm cờ</button><button data-v="koth">Vua đồi</button></div></div>
  <div class="row"><label>Bản đồ</label>
    <div class="seg" id="mapSeg"></div></div>
  <div id="modeDesc"></div>
  <div class="row"><label>Đối thủ</label>
    <div class="seg" id="botSeg"><button data-v="3">3 bot</button><button data-v="5" class="on">5 bot</button><button data-v="7">7 bot</button></div></div>
  <button id="play">CHƠI</button>
  <div class="keys"><b>WASD</b> đi · <b>Shift</b> chạy · <b>Space</b> nhảy · <b>J</b>/chuột trái đấm · <b>K</b> đá · <b>Space + J</b> đá song phi<br>
    giữ <b>U</b>/chuột phải túm – vác (đấm để ném) · <b>L</b> đỡ · <b>E</b> nhặt đồ, giữ <b>E</b> cứu đồng đội · <b>T</b> thiên phú · <b>M</b> tắt tiếng · <b>Esc</b> tạm dừng</div>
</div>

<div id="hud" hidden>
  <div id="feed"></div>
  <div id="topbar"><div id="modeName"></div><div id="timer"></div><div id="objective"></div></div>
  <div id="board"></div>
  <div id="me"><div class="nm" id="meName"></div><div id="meTalent"></div>
    <div class="bar" id="meHp"><i></i></div><div class="bar" id="meSta"><i></i></div><div class="bar" id="meBlk"><i></i></div><div id="meStatus"></div></div>
  <div id="big"></div><div id="sub"></div>
  <div id="prompt" hidden></div>
</div>

<div id="result" class="panel" hidden>
  <h2 id="resTitle"></h2><div id="resSub"></div>
  <table id="resTable"></table>
  <button class="btn" id="again">Ván tiếp</button><button class="btn alt" id="toMenu">Về menu</button>
</div>
<div id="pause" class="panel" hidden>
  <h2>TẠM DỪNG</h2>
  <button class="btn" id="resume">Chơi tiếp</button><button class="btn alt" id="quit">Về menu</button>
</div>

<script type="importmap">{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.165.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.165.0/examples/jsm/"
} }</script>
<script type="module" src="js/main.js"></script>
</body>
</html>
